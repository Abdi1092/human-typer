
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human Typer</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>

<body>
  <main class="app">

    <header class="header">
      <div>
        <div class="brand">HUMAN<span>TYPER</span></div>
        <p class="subtitle">Typing simulator // v1.0</p>
      </div>
      <div class="status-indicator" id="statusIndicator">
        READY
      </div>
    </header>

    <section class="input-section">
      <div class="section-heading">
        <label for="inputText">YOUR TEXT</label>
        <span id="charCount">0 characters</span>
      </div>

      <textarea
        id="inputText"
        placeholder="Enter or paste your text here..."
        spellcheck="true"
      ></textarea>
    </section>

    <section class="settings">
      <div class="section-heading">
        <label for="speed">TYPING SPEED</label>
        <span id="speedValue">45 WPM</span>
      </div>

      <input
        type="range"
        id="speed"
        min="10"
        max="120"
        value="45"
      >

      <div class="range-labels">
        <span>10 WPM</span>
        <span>120 WPM</span>
      </div>
    </section>

    <section class="preview-section">
      <div class="section-heading">
        <label>LIVE SIMULATION</label>
        <span id="progress">0%</span>
      </div>

      <div id="preview" class="preview">
        <span class="placeholder">
          Your typing simulation will appear here...
        </span>
      </div>

      <div class="progress-track">
        <div id="progressBar"></div>
      </div>
    </section>

    <section class="controls">
      <button id="startBtn" class="primary">
        START SIMULATION
      </button>

      <div class="button-row">
        <button id="pauseBtn" disabled>PAUSE</button>
        <button id="stopBtn" disabled>STOP</button>
        <button id="copyBtn">COPY TEXT</button>
      </div>
    </section>

    <section class="docs-section">
      <div class="docs-title">GOOGLE DOCS</div>
      <p>
        Copy your text, open your document, click where
        you want it inserted and paste.
      </p>
      <button id="docsBtn" class="secondary">
        COPY FOR GOOGLE DOCS
      </button>
    </section>

    <footer>
      HUMAN TYPER <span>•</span> LOCAL SIMULATION
    </footer>

  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
